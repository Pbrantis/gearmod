name: Pages

# Publishes the landing page (site/) to GitHub Pages.
# The download list is read from the GitHub Releases API by the page itself, so a new version tag
# (which makes release.yml publish a Release) shows up on the page without redeploying it.
# This workflow only runs when the page changes. Enable it once in Settings > Pages > Source: GitHub Actions.
# The custom domain (gearmod.dev) comes from site/CNAME; the DNS records are set at the domain registrar.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
