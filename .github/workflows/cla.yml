name: CLA

# Confere se o autor do pull request aceitou o CLA (CLA.md). A aceitação é um comentário com a frase exata,
# feito pelo próprio autor em qualquer pull request ou issue deste repositório; vale uma vez para sempre.
# Nada do código do pull request é baixado ou executado aqui (pull_request_target sem checkout).
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && contains(github.event.comment.body, 'I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const phrase = 'I have read the GearMod CLA Document and I hereby sign the CLA'
            const maintainers = ['flucassena']
            const { owner, repo } = context.repo
            const number = context.payload.pull_request?.number ?? context.payload.issue.number
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number })
            const author = pr.user.login
            const signedBy = (comments) => comments.some((c) => c.user?.login === author && c.body?.trim() === phrase)

            let signed = maintainers.includes(author) || pr.user.type === 'Bot'
            if (!signed) signed = signedBy(await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number }))
            if (!signed) {
              const found = await github.rest.search.issuesAndPullRequests({ q: `repo:${owner}/${repo} commenter:${author} "hereby sign the CLA"`, per_page: 20 })
              for (const item of found.data.items) {
                if (item.number === number) continue
                if (signedBy(await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: item.number }))) { signed = true; break }
              }
            }

            const document = `https://github.com/${owner}/${repo}/blob/${pr.base.ref}/CLA.md`
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'CLA', target_url: document,
              state: signed ? 'success' : 'failure',
              description: signed ? 'Contributor License Agreement accepted' : 'Accept the Contributor License Agreement to merge',
            })

            const marker = '<!-- gearmod-cla -->'
            if (!signed && context.eventName === 'pull_request_target' && ['opened', 'reopened'].includes(context.payload.action)) {
              const existing = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number })
              if (!existing.some((c) => c.body?.includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body: [
                  marker,
                  `Thanks for the pull request, @${author}! Before it can be merged, please read the [GearMod Contributor License Agreement](${document}) and accept it by replying here with this exact comment:`,
                  '',
                  `> ${phrase}`,
                  '',
                  'You only need to do this once; it covers your future contributions too. If you contribute on behalf of a company, see also the [Corporate CLA](' + document.replace('CLA.md', 'CLA-CORPORATE.md') + ').',
                ].join('\n') })
              }
            }
            if (!signed) core.setFailed(`@${author} has not accepted the CLA yet.`)
